- case_id: D1_1_adequate
  input:
    session_id: D1_1_adequate
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D1_1_adequate-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 我不知道怎样准备下次咨询，需要整理哪些内容？
    - message_id: D1_1_adequate-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 可以先记下本次最想讨论的问题、近期变化及已有的就诊资料，下次从你最关心的部分开始。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
    - rubric_unpublished
    requires_manual_review: true
