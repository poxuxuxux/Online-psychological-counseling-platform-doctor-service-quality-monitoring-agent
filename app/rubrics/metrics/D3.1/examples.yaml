examples:
- case_id: D3_1_adequate
  input:
    session_id: D3_1_adequate
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D3_1_adequate-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 最近睡不好，我想知道还需要说明些什么。
    - message_id: D3_1_adequate-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 你主要是入睡困难还是容易醒？持续多久了？一周大概几晚，白天工作生活受影响吗？
    - message_id: D3_1_adequate-m3
      role: patient
      message_kind: dialogue
      content_status: available
      content: 主要是入睡困难，持续一周了，每周四五晚，白天工作效率下降。
    - message_id: D3_1_adequate-m4
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 谢谢说明，我们就围绕入睡困难及白天受影响的情况继续了解。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
    - rubric_unpublished
    requires_manual_review: true
  note: 纯合成案例；draft空分是接口硬约束。required_review_rule_ids为至少应命中的条件，允许有原文依据的其他已声明规则。
