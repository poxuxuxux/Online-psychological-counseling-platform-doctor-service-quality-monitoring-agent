# 环节：指标规则配置层；用途：提供机器可读的指标评分规范或评价示例。
examples:
- case_id: D3_2_adequate
  input:
    session_id: D3_2_adequate
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D3_2_adequate-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 我想讨论现在的治疗安排，但最近调整过，资料卡还是旧的。
    - message_id: D3_2_adequate-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 请先说明目前正在接受的治疗、调整时间和变化，旧资料中哪些已经不适用了？我们核对后再讨论。
    - message_id: D3_2_adequate-m3
      role: patient
      message_kind: dialogue
      content_status: available
      content: 目前安排由线下医生上周调整过，旧资料上的内容已经不适用了。我可以补充最新记录。
    - message_id: D3_2_adequate-m4
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 请补充最新记录，我们先核对当前安排，再讨论你的问题。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
    - rubric_unpublished
    - history_verification_pending
    requires_manual_review: true
  note: 纯合成案例；draft空分是接口硬约束。required_review_rule_ids为至少应命中的条件，允许有原文依据的其他已声明规则。
