- case_id: D5_1_adequate
  input:
    session_id: D5_1_adequate
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D5_1_adequate-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 我想制定接下来咨询的计划。工作和家里的事都困扰我，但今天更想先谈工作。
    - message_id: D5_1_adequate-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 今天先聚焦你更在意的工作问题，可以吗？家里的问题我们再商量后续安排。
    - message_id: D5_1_adequate-m3
      role: patient
      message_kind: dialogue
      content_status: available
      content: 可以，今天就先讨论工作。
    - message_id: D5_1_adequate-m4
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 好的，今天聚焦工作带来的困扰，其他问题后续再一起安排。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
