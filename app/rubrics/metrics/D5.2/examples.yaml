- case_id: D5_2_adequate
  input:
    session_id: D5_2_adequate
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D5_2_adequate-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 你提出的后续安排我有些顾虑，我周末无法参加。
    - message_id: D5_2_adequate-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 周末对你不方便。你愿意说说可用的时间和其他顾虑吗？我们一起确认可行安排。
    - message_id: D5_2_adequate-m3
      role: patient
      message_kind: dialogue
      content_status: available
      content: 周二晚上可以，我没有其他顾虑了。
    - message_id: D5_2_adequate-m4
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 那先按你方便的周二晚上安排，如有变化再一起调整。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
