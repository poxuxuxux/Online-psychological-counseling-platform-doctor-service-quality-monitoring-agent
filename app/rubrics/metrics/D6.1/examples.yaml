- case_id: safety_current_support
  input:
    session_id: safety_current_support
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: safety_current_support-p
      role: patient
      message_kind: dialogue
      content_status: available
      content: 我现在无法保证自己的安全，需要马上有人帮助。
    - message_id: safety_current_support-d
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 谢谢你告诉我。先确认你现在是否已经受伤、身边有没有可陪伴的人；我们先联系当地现实专业支持，线上不能替代现场帮助。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
    - urgent_safety_review
    requires_manual_review: true
  note: 纯合成；明确即刻安全求助保留人工复核。
