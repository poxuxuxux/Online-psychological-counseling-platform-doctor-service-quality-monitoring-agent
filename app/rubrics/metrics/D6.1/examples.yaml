# 环节：指标规则配置层；用途：提供机器可读的指标评分规范或评价示例。
examples:
- case_id: D6_1_trigger
  input:
    session_id: D6_1_trigger
    context:
      boundary_confirmed: true
      material_complete: true
      consultation_closed: true
      response_opportunity: true
    messages:
    - message_id: D6_1_trigger-m1
      role: patient
      message_kind: dialogue
      content_status: available
      content: 我现在担心自己会伤害自己，希望得到帮助。
    - message_id: D6_1_trigger-m2
      role: doctor
      message_kind: dialogue
      content_status: available
      content: 我听到了你的担心，我们先关注你现在的安全情况。
  expected:
    applicability: applicable
    score: null
    required_review_rule_ids:
    - safety_response_gap
    requires_manual_review: true
  note: 纯合成案例；命中人工复核规则时空分。required_review_rule_ids为至少应命中的条件。
