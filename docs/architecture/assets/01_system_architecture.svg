<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">心理健康服务质量多 Agent 系统分层架构</title>
  <desc id="desc">将数据适配器、Harness、Agent 注册、患者记忆、共享知识库 RAG、Skills、Hooks、模型与存储接口集成在分层结构中。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3483eb"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#263548}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#64748b}.zone{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:13px;fill:#475569}.small{font-size:11px;fill:#64748b}.flow{fill:none;stroke:#526579;stroke-width:2.2;marker-end:url(#arrow)}.ext{fill:none;stroke:#3483eb;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#blueArrow)}.box{stroke-width:1.8;rx:12}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="52" y="55" class="title">心理健康服务质量多 Agent 系统架构</text>
  <text x="54" y="85" class="subtitle">分层模块化单体：稳定 Harness 编排；患者记忆与共享知识库 RAG 分开管理，并通过所属层接口接入</text>

  <text x="55" y="123" class="zone">入口与数据标准化</text>
  <rect x="55" y="140" width="220" height="100" class="box" fill="#e8f2ff" stroke="#72a8f5"/>
  <text x="75" y="170" class="head">输入来源</text><text x="75" y="194" class="body">XLSX / CSV / 后续 API</text><text x="75" y="216" class="body">Web 演示页提交会话</text>
  <path d="M275 190H310" class="flow"/>
  <rect x="310" y="140" width="250" height="100" class="box" fill="#e9f8ef" stroke="#62bd83"/>
  <text x="330" y="170" class="head">ImporterRegistry</text><text x="330" y="194" class="body">按来源选择导入适配器</text><text x="330" y="216" class="body">保留源工作表与行号</text>
  <path d="M560 190H595" class="flow"/>
  <rect x="595" y="140" width="350" height="100" class="box" fill="#eef0ff" stroke="#8a83e8"/>
  <text x="615" y="170" class="head">Canonical Session / Message</text><text x="615" y="194" class="body">session_id · message_index · create_time</text><text x="615" y="216" class="body">role · message_kind · content</text>
  <rect x="975" y="140" width="275" height="100" class="box" fill="#fff8db" stroke="#d8ae38"/>
  <text x="995" y="170" class="head">数据规则</text><text x="995" y="194" class="body">按 message_index 排序</text><text x="995" y="216" class="body">默认仅 dialogue 进入评分</text>
  <rect x="1280" y="140" width="265" height="100" class="box" fill="#fff0e8" stroke="#e99b6e"/>
  <text x="1300" y="170" class="head">历史关联条件</text><text x="1300" y="194" class="body">需匿名 patient_id 映射</text><text x="1300" y="216" class="body">session_id 只标识会话</text>

  <rect x="55" y="270" width="1490" height="550" rx="20" fill="#ffffff" stroke="#3483eb" stroke-width="2.4" stroke-dasharray="10 7"/>
  <rect x="75" y="253" width="540" height="34" fill="#f8fafc"/><text x="82" y="278" class="zone">Application Harness（固定的评价主流程）</text>

  <rect x="95" y="304" width="1410" height="66" rx="12" fill="#f4f0ff" stroke="#9686e6" stroke-width="1.8"/>
  <text x="112" y="330" class="head">HookDispatcher（生命周期扩展点）</text>
  <rect x="410" y="316" width="180" height="38" rx="8" fill="#ffffff" stroke="#c5b9f1"/><text x="425" y="340" class="small">PreEvaluation</text>
  <rect x="620" y="316" width="180" height="38" rx="8" fill="#ffffff" stroke="#c5b9f1"/><text x="635" y="340" class="small">BeforeAgent</text>
  <rect x="830" y="316" width="180" height="38" rx="8" fill="#ffffff" stroke="#c5b9f1"/><text x="845" y="340" class="small">AfterAgent</text>
  <rect x="1040" y="316" width="180" height="38" rx="8" fill="#ffffff" stroke="#c5b9f1"/><text x="1055" y="340" class="small">BeforeReport</text>
  <rect x="1250" y="316" width="220" height="38" rx="8" fill="#ffffff" stroke="#c5b9f1"/><text x="1265" y="340" class="small">BeforePersist / AfterPersist</text>

  <path d="M770 240V397H195V425" class="flow"/>
  <text x="780" y="390" class="small">统一会话进入用例</text>

  <rect x="95" y="425" width="205" height="142" class="box" fill="#e8f2ff" stroke="#5595ec"/>
  <text x="115" y="457" class="head">ContextBuilder</text><text x="115" y="482" class="body">会话 + MemoryService</text><text x="115" y="505" class="body">RAG via KnowledgeService</text><text x="115" y="532" class="small">患者记忆与知识片段分开注入</text>

  <path d="M300 496H330" class="flow"/>
  <rect x="330" y="425" width="190" height="142" class="box" fill="#fff4df" stroke="#e3a839"/>
  <text x="350" y="457" class="head">PolicyRouter</text><text x="350" y="482" class="body">首诊 / 复诊上下文</text><text x="350" y="505" class="body">风险线索与路由规则</text><text x="350" y="532" class="small">只编排，不给临床结论</text>

  <path d="M520 496H550" class="flow"/>
  <rect x="550" y="397" width="400" height="245" rx="15" fill="#f3f8ff" stroke="#5595ec" stroke-width="2"/>
  <rect x="550" y="397" width="400" height="43" rx="14" fill="#dcecff" stroke="#5595ec" stroke-width="2"/>
  <text x="570" y="425" class="head">AgentRegistry + SkillSelector</text>
  <rect x="572" y="453" width="356" height="42" rx="8" fill="#e7f3ff" stroke="#78a9e7"/><text x="590" y="479" class="body">DoctorAgent · reliability / professional communication</text>
  <rect x="572" y="502" width="356" height="42" rx="8" fill="#eaf8ee" stroke="#70bd85"/><text x="590" y="528" class="body">ProcessAgent · responsiveness / collaboration</text>
  <rect x="572" y="551" width="356" height="42" rx="8" fill="#fff0e8" stroke="#e99b6e"/><text x="590" y="577" class="body">PatientAgent · empathy / risk response</text>
  <text x="575" y="622" class="small">新增 Agent：实现 Agent 接口、声明指标与 Skill，再注册</text>

  <path d="M950 496H980" class="flow"/>
  <rect x="980" y="425" width="175" height="142" class="box" fill="#e7f4ff" stroke="#4f9bd8"/>
  <text x="998" y="457" class="head">EvidenceVerifier</text><text x="998" y="482" class="body">对话引用精确匹配</text><text x="998" y="505" class="body">KB 引用来源/版本核验</text><text x="998" y="532" class="small">知识不能替代行为证据</text>

  <path d="M1155 496H1180" class="flow"/>
  <rect x="1180" y="425" width="165" height="142" class="box" fill="#f0edff" stroke="#8878df"/>
  <text x="1198" y="457" class="head">Arbitrator</text><text x="1198" y="482" class="body">比较 Agent 分歧</text><text x="1198" y="505" class="body">保留分项和证据</text><text x="1198" y="532" class="small">超阈值 → 人工复核</text>

  <path d="M1345 496H1370" class="flow"/>
  <rect x="1370" y="425" width="145" height="142" class="box" fill="#ffeaf2" stroke="#df729a"/>
  <text x="1387" y="457" class="head">Summary</text><text x="1387" y="482" class="body">分维度汇总</text><text x="1387" y="505" class="body">版本化报告</text><text x="1387" y="532" class="small">Report v1</text>

  <path d="M1068 425V390H750V397" class="ext"/>
  <text x="782" y="384" class="small">仅对具体失败指标定向重评，限一次</text>

  <rect x="95" y="684" width="445" height="94" rx="12" fill="#f7f9fc" stroke="#a8b5c4"/>
  <text x="115" y="713" class="head">LLMProvider Port / ModelRegistry</text><text x="115" y="738" class="body">规则基线 · 本地模型 · 远程模型适配器</text><text x="115" y="760" class="small">Agent 调用统一接口，不绑定模型厂商</text>
  <path d="M540 730H572V642" class="ext"/>

  <rect x="570" y="684" width="445" height="94" rx="12" fill="#f4f0ff" stroke="#a392e9"/>
  <text x="590" y="713" class="head">Domain Contracts（各模块共用）</text><text x="590" y="738" class="body">AgentResult → ConversationEvidenceRef + KnowledgeRef</text><text x="590" y="760" class="small">对话证据证明行为；知识引用解释标准和依据</text>
  <path d="M800 684V655" class="ext"/>

  <rect x="1045" y="684" width="470" height="94" rx="12" fill="#eaf8ee" stroke="#70bd85"/>
  <text x="1065" y="713" class="head">Repository Port → SQLite Adapter</text><text x="1065" y="738" class="body">sessions · evaluations · patient_memory · audit</text><text x="1065" y="760" class="small">知识库独立版本化；存储实现经 Port 隔离</text>
  <path d="M1440 567V650H1280V684" class="ext"/>
  <path d="M1045 730H315V567" class="ext"/>

  <text x="55" y="858" class="zone">扩展点落在所属层，而不是单独外挂</text>
  <rect x="55" y="880" width="350" height="120" class="box" fill="#e9f8ef" stroke="#62bd83"/>
  <text x="75" y="912" class="head">数据源扩展</text><text x="75" y="939" class="body">在 ImporterRegistry 注册新 Adapter</text><text x="75" y="965" class="small">统一输出 Canonical Session / Message</text>
  <rect x="430" y="880" width="350" height="120" class="box" fill="#e8f2ff" stroke="#5595ec"/>
  <text x="450" y="912" class="head">评价能力扩展</text><text x="450" y="939" class="body">在 AgentRegistry 注册新 Agent</text><text x="450" y="965" class="small">统一输出 AgentResult，旧 Agent 不改</text>
  <rect x="805" y="880" width="350" height="120" class="box" fill="#f4f0ff" stroke="#9686e6"/>
  <text x="825" y="912" class="head">治理逻辑扩展</text><text x="825" y="939" class="body">在 HookDispatcher 注册事件处理器</text><text x="825" y="965" class="small">隐私、审计、证据检查等确定性逻辑</text>
  <rect x="1180" y="880" width="365" height="120" class="box" fill="#fff4df" stroke="#e3a839"/>
  <text x="1200" y="912" class="head">运行能力扩展</text><text x="1200" y="939" class="body">新增 Retriever / Index / Model Adapter</text><text x="1200" y="965" class="small">替换基础设施实现，不改 Agent 契约</text>
  <text x="55" y="1040" class="small">设计边界：首期静态注册 + 配置驱动；第三方动态插件加载、分布式队列和微服务留待确有需求时再引入。</text>
</svg>
