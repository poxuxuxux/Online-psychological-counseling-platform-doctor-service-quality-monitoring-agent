<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1370" viewBox="0 0 1700 1370">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52647a"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2864b4"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#53657b}
      .head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#53657b}
      .mono{font-family:Consolas,'Courier New',monospace;font-size:12px;fill:#273c59}
      .box{fill:#fff;stroke:#a9b9cb;stroke-width:1.5;rx:12}
      .blue{fill:#eef5ff;stroke:#6b9fe0}.purple{fill:#f5f0ff;stroke:#a28ade}
      .green{fill:#eef9f2;stroke:#70b58a}.orange{fill:#fff5e8;stroke:#dda756}
      .red{fill:#fff0ef;stroke:#dc8984}.gray{fill:#f3f6f9;stroke:#a9b9cb}
      .hook{fill:#fff9e9;stroke:#d5a83f;stroke-width:1.4;rx:9}
      .line{fill:none;stroke:#52647a;stroke-width:2;marker-end:url(#arrow)}
      .lineBlue{fill:none;stroke:#2864b4;stroke-width:2.3;marker-end:url(#arrowBlue)}
      .dashed{fill:none;stroke:#9a7a2e;stroke-width:1.6;stroke-dasharray:7 5}
      .divider{stroke:#dce4ed;stroke-width:1}
    </style>
  </defs>
  <rect width="1700" height="1370" fill="#f7f9fc"/>
  <text x="60" y="58" class="title">图 2｜一次评价任务的运行时编排与 Hook 生命周期</text>
  <text x="60" y="86" class="subtitle">主流程保持稳定：接入 → 记忆与知识检索 → 路由并行评价 → 双类型证据核验 → 分歧处理 → 报告落库。</text>

  <!-- entry and canonicalization -->
  <rect x="60" y="125" width="255" height="112" class="box blue"/>
  <text x="82" y="157" class="head">1. 接收任务</text>
  <text x="82" y="184" class="body">POST /api/v1/evaluations</text>
  <text x="82" y="209" class="small">session_id / 上传文件 / 评价配置</text>
  <rect x="365" y="125" width="285" height="112" class="box blue"/>
  <text x="387" y="157" class="head">2. 数据适配与标准化</text>
  <text x="387" y="184" class="body">ImporterRegistry → SessionImporter</text>
  <text x="387" y="209" class="small">映射角色、轮次、时间、message_kind</text>
  <rect x="700" y="125" width="365" height="112" class="box gray"/>
  <text x="722" y="157" class="head">规范化会话对象</text>
  <text x="722" y="184" class="mono">Session + Message[] + SourceRef</text>
  <text x="722" y="209" class="small">保留来源行号；按 message_index 排序</text>
  <path d="M315 181 H355" class="line"/><path d="M650 181 H690" class="line"/>

  <!-- Hook one -->
  <rect x="1115" y="125" width="525" height="112" class="hook"/>
  <text x="1140" y="156" class="head">Hook：AfterImport / BeforeEvaluation</text>
  <text x="1140" y="183" class="body">脱敏校验、字段质量检查、审计事件、任务拦截</text>
  <text x="1140" y="209" class="small">失败时返回可解释错误；Hook 不负责改写主编排</text>
  <path d="M1065 181 H1105" class="dashed"/>

  <!-- context stage -->
  <rect x="60" y="290" width="455" height="205" class="box purple"/>
  <text x="84" y="325" class="head">3. ContextBuilder：组装本次评价上下文</text>
  <text x="84" y="358" class="body">• 当前会话：仅纳入有效 dialogue 轮次</text>
  <text x="84" y="385" class="body">• 患者记忆：patient_id 映射后按权限读取</text>
  <text x="84" y="412" class="body">• 共享知识：KnowledgeService 检索版本化片段</text>
  <text x="84" y="439" class="body">• SkillSelector 装载指标 Skills 与情境信息</text>
  <text x="84" y="472" class="small">患者记忆与共享知识库分开存取；缺历史可降级</text>

  <rect x="570" y="290" width="430" height="205" class="box purple"/>
  <text x="594" y="325" class="head">4. PolicyRouter：情境识别与任务规划</text>
  <text x="594" y="358" class="body">• 识别咨询类型、阶段、风险等级</text>
  <text x="594" y="385" class="body">• 选择必需 Agent 与可选 Agent</text>
  <text x="594" y="412" class="body">• 配置并发、超时、重试与人工复核门槛</text>
  <text x="594" y="439" class="body">• 生成不可变 EvaluationPlan</text>
  <text x="594" y="472" class="small">规则配置可先用 YAML；复杂路由以后再升级</text>
  <path d="M785 237 V278" class="lineBlue"/>
  <path d="M515 392 H560" class="lineBlue"/>

  <rect x="1055" y="290" width="585" height="205" class="hook"/>
  <text x="1080" y="325" class="head">Hook：BeforeContext / BeforeRetrieval / AfterRetrieval</text>
  <text x="1080" y="358" class="body">BeforeRetrieval：权限、过滤条件、查询范围检查</text>
  <text x="1080" y="385" class="body">AfterRetrieval：记录来源、版本、命中片段与耗时</text>
  <text x="1080" y="412" class="body">BeforeRoute：风险门控；Router 保留最终决策权</text>
  <text x="1080" y="463" class="small">新增知识源/策略注册接入，不改主流程</text>
  <path d="M1000 392 H1045" class="dashed"/>

  <!-- parallel agents -->
  <rect x="60" y="550" width="1580" height="395" class="box"/>
  <text x="88" y="586" class="head">5. AgentRegistry 按计划分发；各 Agent 并行执行相同输入契约</text>
  <text x="88" y="612" class="small">注册表负责发现与创建；每个 Agent 聚焦一类评价责任，不直接互相调用，也不自行拼最终报告。</text>
  <rect x="90" y="650" width="335" height="190" class="box blue"/>
  <text x="114" y="684" class="head">DoctorServiceAgent</text>
  <text x="114" y="716" class="body">可靠性｜响应性｜专业沟通</text>
  <text x="114" y="745" class="body">识别医生可观察行为</text>
  <text x="114" y="786" class="mono">evaluate(AgentInput)</text>
  <rect x="455" y="650" width="335" height="190" class="box green"/>
  <text x="479" y="684" class="head">ProcessAgent</text>
  <text x="479" y="716" class="body">咨询阶段｜目标协作｜过程连续性</text>
  <text x="479" y="745" class="body">关注互动过程与阶段适配</text>
  <text x="479" y="786" class="mono">evaluate(AgentInput)</text>
  <rect x="820" y="650" width="335" height="190" class="box purple"/>
  <text x="844" y="684" class="head">RelationalSupportAgent</text>
  <text x="844" y="716" class="body">情绪回应｜共情｜患者参与</text>
  <text x="844" y="745" class="body">评价医生对患者表达的响应</text>
  <text x="844" y="786" class="mono">evaluate(AgentInput)</text>
  <rect x="1185" y="650" width="425" height="190" class="box orange"/>
  <text x="1209" y="684" class="head">RiskResponseAgent（条件启用）</text>
  <text x="1209" y="716" class="body">风险线索识别｜回应行为｜升级建议</text>
  <text x="1209" y="745" class="body">不替代临床诊断或紧急干预</text>
  <text x="1209" y="786" class="mono">evaluate(AgentInput)</text>
  <path d="M785 495 V525 H257 V638" class="lineBlue"/>
  <path d="M785 525 H622 V638" class="lineBlue"/>
  <path d="M785 525 H987 V638" class="lineBlue"/>
  <path d="M785 525 H1397 V638" class="lineBlue"/>
  <text x="110" y="874" class="small">统一 AgentResult：scores[]、conversation_evidence_refs[]、knowledge_refs[]、confidence、limitations、agent_version</text>
  <text x="110" y="900" class="small">ConversationEvidenceRef 支撑“医生做了什么”；KnowledgeRef 支撑“采用什么评价标准”，两者不可互相替代。</text>

  <!-- embedded hooks within agents -->
  <rect x="95" y="918" width="1515" height="0" fill="none"/>
  <rect x="60" y="971" width="1580" height="72" class="hook"/>
  <text x="84" y="1001" class="head">Agent 生命周期 Hooks（嵌在分发执行点）</text>
  <text x="84" y="1027" class="body">BeforeAgent：上下文裁剪 / 安全策略　｜　AfterAgent：结果结构校验 / 指标补齐　｜　OnAgentError：超时记录 / 降级 / 有界重试</text>
  <text x="1300" y="1001" class="small">hook 不修改 Agent 契约</text>
  <path d="M1300 945 V960" class="dashed"/>

  <!-- verification and arbitration -->
  <rect x="60" y="1080" width="310" height="145" class="box orange"/>
  <text x="82" y="1114" class="head">6. EvidenceVerifier</text>
  <text x="82" y="1144" class="body">对话证据：turn_id 与原文定位</text>
  <text x="82" y="1170" class="body">知识引用：来源、版本和适用范围</text>
  <text x="82" y="1200" class="small">知识库不能代替行为证据；缺证据则 NA</text>
  <rect x="425" y="1080" width="330" height="145" class="box orange"/>
  <text x="447" y="1114" class="head">7. ConflictArbitrator</text>
  <text x="447" y="1144" class="body">比较同维度评分、证据与置信度</text>
  <text x="447" y="1170" class="body">低分歧自动汇总；高分歧定向复核</text>
  <text x="447" y="1200" class="small">复核 Agent 只重评冲突维度</text>
  <rect x="810" y="1080" width="340" height="145" class="box green"/>
  <text x="832" y="1114" class="head">8. SummaryBuilder</text>
  <text x="832" y="1144" class="body">形成分维度得分、依据和建议</text>
  <text x="832" y="1170" class="body">标注不确定项、缺失项及复核状态</text>
  <text x="832" y="1200" class="small">输出 EvaluationReport.v1</text>
  <rect x="1205" y="1080" width="435" height="145" class="box blue"/>
  <text x="1227" y="1114" class="head">9. Repository + API Response</text>
  <text x="1227" y="1144" class="body">保存结果、证据引用与版本快照</text>
  <text x="1227" y="1170" class="body">返回 report_id / status / report</text>
  <text x="1227" y="1200" class="small">后续查询与导出读取同一报告契约</text>
  <path d="M257 840 V1058" class="line"/>
  <path d="M622 840 V1058" class="line"/>
  <path d="M987 840 V1058" class="line"/>
  <path d="M1397 840 V1058" class="line"/>
  <path d="M370 1152 H415" class="line"/><path d="M755 1152 H800" class="line"/><path d="M1150 1152 H1195" class="line"/>

  <rect x="60" y="1260" width="1580" height="70" class="box gray"/>
  <text x="84" y="1291" class="head">任务版本快照（随报告持久化）</text>
  <text x="405" y="1291" class="mono">skill_versions · skill_bundle_hash · kb_version · index_version · memory_refs · workflow_version · agent_versions · model_id</text>
  <text x="84" y="1316" class="small">这样可追溯“为什么得到这个结果”，并支持后续对新旧评价标准做对照；真实上线还需权限、脱敏、审计和人工治理。</text>
</svg>
