# 功能：定义 Python 打包、运行依赖、开发依赖和测试/格式化工具配置。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online-psychological-service-quality-agent"
version = "2.0.0"
description = "LangGraph dynamic agent teams for doctor service quality evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "PyYAML>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "ijson>=3.3,<4.0",
    "openpyxl>=3.1,<4.0",
    "tzdata>=2024.1",
    "langgraph>=1.2.16,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rubrics/metrics/*/*.yaml", "rubrics/metrics/*/*.md", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
