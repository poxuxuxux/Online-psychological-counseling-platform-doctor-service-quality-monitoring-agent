# Railway deployment configuration for the FastAPI smoke environment.
# Build with the repository Dockerfile so dependency installation is explicit.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
